<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration & Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f4f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            border-color: #007bff;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .error {
            color: red;
            font-size: 13px;
            margin-top: 5px;
        }

        .success {
            color: green;
            text-align: center;
            margin-bottom: 15px;
        }

        .hidden {
            display: none;
        }

        .link {
            text-align: center;
            margin-top: 15px;
        }

        .link a {
            color: #007bff;
            cursor: pointer;
        }

        .show-password {
            margin-top: 7px;
            font-size: 13px;
        }

        .show-password input {
            width: auto;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- ================= REGISTRATION ================= -->
    <div id="registerPage">

        <h2>Registration</h2>

        <div id="registerMessage"></div>

        <form id="registerForm">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name">
                <div id="nameError" class="error"></div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="example@gmail.com">
                <div id="emailError" class="error"></div>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="phone" placeholder="01XXXXXXXXX">
                <div id="phoneError" class="error"></div>
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" id="dob">
                <div id="dobError" class="error"></div>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select id="gender">
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
                <div id="genderError" class="error"></div>
            </div>

            <!-- PASSWORD -->
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password">
                <div id="passwordError" class="error"></div>

                <div class="show-password">
                    <input type="checkbox" id="showRegisterPassword">
                    Show Password
                </div>
            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm password">
                <div id="confirmPasswordError" class="error"></div>
            </div>

            <button type="submit">Register</button>

        </form>

        <div class="link">
            Already registered?
            <a onclick="showLogin()">Login</a>
        </div>

    </div>


    <!-- ================= LOGIN ================= -->
    <div id="loginPage" class="hidden">

        <h2>Login</h2>

        <div id="loginMessage"></div>

        <form id="loginForm">

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password">

                <div class="show-password">
                    <input type="checkbox" id="showLoginPassword">
                    Show Password
                </div>
            </div>

            <button type="submit">Login</button>

        </form>

        <div class="link">
            Don't have an account?
            <a onclick="showRegister()">Register</a>
        </div>

    </div>


    <!-- ================= DASHBOARD ================= -->
    <div id="dashboard" class="hidden">

        <h2>Welcome!</h2>

        <p id="welcomeText" style="text-align:center; margin-bottom:20px;"></p>

        <button onclick="logout()">Logout</button>

    </div>

</div>


<script>

    // Show / Hide Password - Registration
    document.getElementById("showRegisterPassword").addEventListener("change", function () {

        let password = document.getElementById("password");
        let confirmPassword = document.getElementById("confirmPassword");

        if (this.checked) {
            password.type = "text";
            confirmPassword.type = "text";
        } else {
            password.type = "password";
            confirmPassword.type = "password";
        }
    });


    // Show / Hide Password - Login
    document.getElementById("showLoginPassword").addEventListener("change", function () {

        let password = document.getElementById("loginPassword");

        if (this.checked) {
            password.type = "text";
        } else {
            password.type = "password";
        }
    });


    // ================= REGISTRATION =================

    document.getElementById("registerForm").addEventListener("submit", function(e) {

        e.preventDefault();

        // Clear old errors
        document.querySelectorAll(".error").forEach(function(error) {
            error.innerHTML = "";
        });

        document.getElementById("registerMessage").innerHTML = "";

        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value.trim();
        let phone = document.getElementById("phone").value.trim();
        let dob = document.getElementById("dob").value;
        let gender = document.getElementById("gender").value;
        let password = document.getElementById("password").value;
        let confirmPassword = document.getElementById("confirmPassword").value;

        let valid = true;


        // Name validation
        if (name.length < 2) {
            document.getElementById("nameError").innerHTML =
                "Please enter your full name.";
            valid = false;
        }


        // Email validation
        let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailPattern.test(email)) {
            document.getElementById("emailError").innerHTML =
                "Please enter a valid email.";
            valid = false;
        }


        // Phone validation - Bangladesh
        let phonePattern = /^01[3-9]\d{8}$/;

        if (!phonePattern.test(phone)) {
            document.getElementById("phoneError").innerHTML =
                "Enter a valid Bangladesh phone number. Example: 01712345678";
            valid = false;
        }


        // DOB validation
        if (dob === "") {

            document.getElementById("dobError").innerHTML =
                "Please select your date of birth.";

            valid = false;

        } else {

            let today = new Date();
            let selectedDate = new Date(dob);

            if (selectedDate > today) {

                document.getElementById("dobError").innerHTML =
                    "Date of birth cannot be in the future.";

                valid = false;
            }
        }


        // Gender validation
        if (gender === "") {

            document.getElementById("genderError").innerHTML =
                "Please select your gender.";

            valid = false;
        }


        // Password validation
        if (password.length < 8) {

            document.getElementById("passwordError").innerHTML =
                "Password must be at least 8 characters.";

            valid = false;

        } else if (!/[A-Z]/.test(password)) {

            document.getElementById("passwordError").innerHTML =
                "Password must contain an uppercase letter.";

            valid = false;

        } else if (!/[a-z]/.test(password)) {

            document.getElementById("passwordError").innerHTML =
                "Password must contain a lowercase letter.";

            valid = false;

        } else if (!/[0-9]/.test(password)) {

            document.getElementById("passwordError").innerHTML =
                "Password must contain a number.";

            valid = false;

        } else if (!/[!@#$%^&*]/.test(password)) {

            document.getElementById("passwordError").innerHTML =
                "Password must contain a special character.";

            valid = false;
        }


        // Confirm password
        if (password !== confirmPassword) {

            document.getElementById("confirmPasswordError").innerHTML =
                "Passwords do not match.";

            valid = false;
        }


        // Stop if validation failed
        if (!valid) {
            return;
        }


        // Save registration data
        let user = {
            name: name,
            email: email,
            phone: phone,
            dob: dob,
            gender: gender,
            password: password
        };

        localStorage.setItem("user", JSON.stringify(user));


        // Registration success
        document.getElementById("registerMessage").innerHTML =
            '<div class="success">Registration successful!</div>';


        // Login page show
        setTimeout(function() {

            document.getElementById("registerPage").classList.add("hidden");
            document.getElementById("loginPage").classList.remove("hidden");

            document.getElementById("loginEmail").value = email;

            document.getElementById("loginMessage").innerHTML =
                '<div class="success">Registration successful. Now login.</div>';

        }, 800);

    });


    // ================= LOGIN =================

    document.getElementById("loginForm").addEventListener("submit", function(e) {

        e.preventDefault();

        let email = document.getElementById("loginEmail").value.trim();
        let password = document.getElementById("loginPassword").value;

        let savedUser = localStorage.getItem("user");

        if (!savedUser) {

            document.getElementById("loginMessage").innerHTML =
                '<div class="error">No registered user found. Please register first.</div>';

            return;
        }


        let user = JSON.parse(savedUser);


        // Check email and password
        if (email === user.email && password === user.password) {

            document.getElementById("loginPage").classList.add("hidden");
            document.getElementById("dashboard").classList.remove("hidden");

            document.getElementById("welcomeText").innerHTML =
                "Hello, <b>" + user.name + "</b><br>Login successful!";

        } else {

            document.getElementById("loginMessage").innerHTML =
                '<div class="error">Invalid email or password.</div>';
        }

    });


    // ================= SHOW LOGIN =================

    function showLogin() {

        document.getElementById("registerPage").classList.add("hidden");
        document.getElementById("loginPage").classList.remove("hidden");
        document.getElementById("dashboard").classList.add("hidden");

    }


    // ================= SHOW REGISTER =================

    function showRegister() {

        document.getElementById("loginPage").classList.add("hidden");
        document.getElementById("registerPage").classList.remove("hidden");
        document.getElementById("dashboard").classList.add("hidden");

    }


    // ================= LOGOUT =================

    function logout() {

        document.getElementById("dashboard").classList.add("hidden");
        document.getElementById("loginPage").classList.remove("hidden");

        document.getElementById("loginPassword").value = "";

    }

</script>

</body>
</html>
