<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Registration</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #667eea;
}

.box {
    width: 400px;
    max-width: 95%;
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.2);
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

.tabs {
    display: flex;
    margin-bottom: 20px;
}

.tabs button {
    width: 50%;
    padding: 12px;
    border: 0;
    cursor: pointer;
}

.tabs .active {
    background: #667eea;
    color: white;
}

.form {
    display: none;
}

.form.active {
    display: block;
}

.field {
    margin-bottom: 15px;
}

.field label {
    display: block;
    margin-bottom: 5px;
    font-size: 14px;
    font-weight: bold;
}

.field input,
.field select {
    width: 100%;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 14px;
}

.field input:focus,
.field select:focus {
    outline: none;
    border-color: #667eea;
}

.error {
    color: red;
    font-size: 12px;
    margin-top: 4px;
    min-height: 15px;
}

.success {
    color: green;
}

.message {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
}

.submit {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 5px;
    background: #667eea;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.submit:hover {
    background: #5568d9;
}
</style>
</head>
