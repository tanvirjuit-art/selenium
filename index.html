<!DOCTYPE html>
<html lang="en">

    <title>Registration & Login</title>

    <style>

            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: #fff;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 15px 40px rgba(0,0,0,.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #222;
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
        }

        .tabs button {
            flex: 1;
            padding: 13px;
            border: none;
            cursor: pointer;
            background: #eee;
            font-size: 15px;
        }

        .tabs button:first-child {
            border-radius: 7px 0 0 7px;
        }

        .tabs button:last-child {
            border-radius: 0 7px 7px 0;
        }

        .tabs button.active {
            background: #667eea;
            color: #fff;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #667eea;
        }

        .form-group input.valid {
            border-color: #198754;
        }

        .form-group input.invalid {
            border-color: #dc3545;
        }

        .error {
            display: block;
            min-height: 17px;
            margin-top: 4px;
            color: #dc3545;
            font-size: 12px;
        }

        .hint {
            margin-top: 4px;
            color: #777;
            font-size: 11px;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background: #5568d9;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }

        .success {
            color: #198754;
        }

        .message-error {
            color: #dc3545;
        }

        .password-rules {
            margin-top: 7px;
            padding: 8px;
            background: #f7f7f7;
            border-radius: 5px;
            font-size: 11px;
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>
