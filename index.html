<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registration & Login</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
}

.box {
    width: 400px;
    max-width: 95%;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.2);
}

h2 {
    text-align: center;
    margin-bottom: 25px;
}

.form {
    display: none;
}

.form.active {
    display: block;
}

.field {
    margin-bottom: 15px;
}

.field label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
    font-size: 14px;
}

.field input,
.field select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
}

.field input:focus,
.field select:focus {
    outline: none;
    border-color: #667eea;
}

.error {
    color: red;
    font-size: 12px;
    margin-top: 4px;
    min-height: 15px;
}

.success {
    color: green;
}

.message {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
}

.btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 6px;
    background: #667eea;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.btn:hover {
    background: #5568d9;
}

.link {
    text-align: center;
    margin-top: 18px;
    font-size: 14px;
}

.link button {
    border: none;
    background: none;
    color: #667eea;
    cursor: pointer;
    font-weight: bold;
}
</style>
</head>
